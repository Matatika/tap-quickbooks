### A CI workflow template that runs linting and python testing
### TODO: Modify as needed or as desired.

name: Test tap-quickbooks

on:
  push:
    branches: [master]
    paths:
    - .github/workflows/test.yml
    - tap_quickbooks/**
    - tests/**
    - pyproject.toml
    - uv.lock
  pull_request:
    paths:
    - .github/workflows/test.yml
    - tap_quickbooks/**
    - tests/**
    - pyproject.toml
    - uv.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  pytest:
    name: Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: ">=0.8"
    - name: Run Tox
      env:
        TAP_QUICKBOOKS_OAUTH_CREDENTIALS_CLIENT_ID: ${{ secrets.TAP_QUICKBOOKS_CLIENT_ID }}
        TAP_QUICKBOOKS_OAUTH_CREDENTIALS_CLIENT_SECRET: ${{ secrets.TAP_QUICKBOOKS_CLIENT_SECRET }}
        TAP_QUICKBOOKS_OAUTH_CREDENTIALS_REFRESH_TOKEN: ${{ secrets.TAP_QUICKBOOKS_REFRESH_TOKEN }}
        TAP_QUICKBOOKS_REALM_ID: ${{ secrets.TAP_QUICKBOOKS_REALM_ID }}
        TAP_QUICKBOOKS_START_DATE: ${{ secrets.TAP_QUICKBOOKS_START_DATE }}
        TAP_QUICKBOOKS_SANDBOX: ${{ secrets.TAP_QUICKBOOKS_SANDBOX }}
      run: |
        uvx --with=tox-uv tox -e $(echo py${{ matrix.python-version }} | tr -d .)

  typing:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: 3.x
    - name: Setup uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: ">=0.8"
    - name: Run Tox
      run: |
        uvx --with=tox-uv tox -e typing
